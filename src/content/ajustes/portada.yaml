titulo: "Los muebles que ves en línea, con su"
tituloItalica: "medida justa."
bajada: "Mesas, mesas de luz y estantes de diseño, cada uno con sus medidas ya resueltas. Los fabricamos en nuestro taller de Rosario y te los llevamos a casa. Y si tu espacio pide otra medida, también la hacemos."
